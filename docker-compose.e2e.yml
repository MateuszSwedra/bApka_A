# Izolowana baza tylko pod API e2e (nie miesza z docker-compose.yml / danymi deweloperskimi).
services:
  db-e2e:
    image: postgres:15-alpine
    container_name: bapka_db_e2e
    environment:
      POSTGRES_USER: bapka_e2e
      POSTGRES_PASSWORD: bapka_e2e
      POSTGRES_DB: bapka_e2e
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bapka_e2e -d bapka_e2e']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
