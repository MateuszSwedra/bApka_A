[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM9
monitor_port = COM9
upload_flags =
	--no-stub
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-std=gnu++17
build_unflags =
	-std=gnu++11
lib_deps =
	bblanchon/ArduinoJson@^7.3.0
