; bApka — test LED + buzzer (bez Wi‑Fi / API)
; Port: USB-SERIAL CH340 = COM9

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Wolniej + bez stuba — omija "Failed to start stub flasher" na CH340
upload_speed = 115200
upload_port = COM9
monitor_port = COM9
upload_flags =
	--no-stub
